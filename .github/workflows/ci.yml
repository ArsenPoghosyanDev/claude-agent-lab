name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests

  evals:
    # Runs the agent against evals/cases.jsonl and grades it with LLM-as-judge.
    # Needs a CLAUDE_CODE_OAUTH_TOKEN repo secret (`claude setup-token`);
    # skipped when the secret is not set (e.g. on forks).
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      APPROVAL_MODE: auto
    steps:
      - uses: actions/checkout@v4
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          python-version: "3.12"
      - if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: pip install -r requirements.txt
      - if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: python -m evals.run_evals --threshold 0.8
      - uses: actions/upload-artifact@v4
        if: always() && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          name: eval-report
          path: evals/report.json
